; Zeitprisma – M5Stack StickS3 (K150)
; Basis: PlatformIO-Vorgabe aus der M5-Doku zum StickS3
; Bauform waehlen:  pio run -e muenze8 -t upload    (Standard)
;                   pio run -e muenze12 -t upload
;                   pio run -e prisma10 -t upload
[platformio]
default_envs = muenze8

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1

[env:muenze8]
; 8-Eck-Muenze: Ruecken unten = Pause, Randseiten 1..8

[env:muenze12]
; 12-Eck-Muenze: Ruecken unten = Pause, Randseiten 1..12
build_flags = ${env.build_flags} -DPRISMA_RING=12

[env:prisma10]
; Zehnkant-Prisma: Seite 0 (Display) = Pause, Seiten 1..9
build_flags = ${env.build_flags} -DPRISMA_PRISMA10
